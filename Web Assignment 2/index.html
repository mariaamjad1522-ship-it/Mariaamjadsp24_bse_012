<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="quiz-card mx-auto">

      <header class="d-flex justify-content-between align-items-center mb-4">
        <div class="brand">
          <span class="brand-icon">?</span>
          <h1 class="h5 m-0">Web Quiz</h1>
        </div>
        <button id="themeBtn" class="btn btn-theme btn-sm" type="button">Dark mode</button>
      </header>

      <!-- Start screen -->
      <section id="startScreen">
        <h2 class="hero-title">Test your web skills</h2>
        <p class="text-body-secondary mb-4">
          5 random questions on HTML, CSS and JavaScript.
          You get 15 seconds for each question.
        </p>
        <label for="nameInput" class="form-label fw-semibold">Your name</label>
        <input id="nameInput" class="form-control form-control-lg mb-3" placeholder="e.g. Maria Amjad">
        <button id="startBtn" class="btn btn-main btn-lg w-100" type="button">Start quiz</button>
      </section>

      <!-- Quiz screen -->
      <section id="quizScreen" class="d-none">
        <div id="segments" class="segments mb-4" aria-label="Progress"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <span id="counter" class="counter-pill"></span>
          <span id="timer" class="timer">15s</span>
        </div>

        <h2 id="question" class="question-text mb-4"></h2>
        <div id="options" class="d-grid gap-3"></div>
        <p id="feedback" class="feedback mt-4 mb-0" aria-live="polite"></p>
      </section>

      <!-- Result screen -->
      <section id="resultScreen" class="d-none text-center">
        <h2 class="hero-title">Quiz finished</h2>
        <div class="score-circle mx-auto my-4"><span id="scoreText"></span></div>
        <p id="scoreMsg" class="text-body-secondary mb-4"></p>
        <div class="d-grid gap-2 d-sm-flex justify-content-center">
          <button id="pdfBtn" class="btn btn-main" type="button">Download PDF</button>
          <button id="restartBtn" class="btn btn-theme" type="button">Play again</button>
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
